<style>
  /* the portfolio has its own nav, so the original top bar is hidden */
  header.header, nav.mobile-nav { display: none !important; } /* + the small-screen menu pill */
  /* no-sound build: the "enter with / without audio" screen is skipped automatically */
  .loader__actions { opacity: 0 !important; pointer-events: none !important; }
  /* the form only builds an email (mailto:), which cannot carry a file, so the attach button is hidden */
  .contact-form__attach { display: none !important; }
  /* DARK instead of white: the scene's own dark theme (cookie below) gives the loader and the area around the
     opening ring the original's dark colour. */
  /* no landing screen: nothing is shown while the scene waits; it goes straight into the opening ring */
  .loader { opacity: 0 !important; }
  .loader__logo { display: none !important; }                      /* no name on the loader */
  .loader__bar { background: rgba(255, 255, 255, 0.16) !important; } /* progress track readable on dark */
  /* the scene's own AI assistant (orb + speech bubble + chat) is removed: the portfolio has its own assistant */
  .ai-btn, .ai-bubble, .ai-overlay { display: none !important; }
  /* LAKE MODE (?start=lake): only the 3D lake is shown (no page text / UI) until the portfolio opens the contact page */
  html.lake-mode .ui { visibility: hidden !important; }
  /* ===== BLUE accent (the hero's cobalt #4C6FFF, same family as the "Let's talk" button) =====
     --primary drives: the title arrow, the "Send it" glow, focus colour, caret, selection, list numbers.
     To go back to purple, delete this one block. (The 3D tree / lake keep their own purple art direction.) */
  .contact-window {
    --primary: #4c6fff; --primary-rgb: 76, 111, 255;
    --primary-active: #3a57e8; --primary-active-rgb: 58, 87, 232;
    /* the button's 1px outline gradient: identical to the hero's .gb--blue */
    --btn-stroke-colors: #1b2a8f 0%, #4c6fff 4%, #e8eeff 31%, #e8eeff 60%, #b9c6ff 85%, #4c6fff 100%;
  }
  .contact-window .c-hero__title-sub-3-icon { color: #4c6fff; }
  /* "Send it": same body tint, same glow and same smoky wave colours as the blue "Let's talk" button */
  .contact-window .button.button--primary { background-color: rgba(76, 111, 255, .07); }
  .contact-window .button.button--primary .button__gradient { filter: blur(6px) hue-rotate(-34deg) saturate(1.08); } /* purple waves -> cobalt waves */
  /* tactile press, like the hero's buttons */
  .contact-window .button:not(:disabled):active { transform: scale(.965); transition-duration: .12s; }
  .contact-window .button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  /* "What I can do" is a plain list now (nothing to choose) */
  .radio-item-wrapper { cursor: default !important; }
  .radio-item-wrapper:hover { color: var(--foreground) !important; }

   pixel ratio (2x = ~5.4 MP on a MacBook). Capping the ratio the scene sees at 1.5 cuts the pixels it has to draw by ~44% with
   no visible difference on this soft, bloomy night scene. Change SCENE_MAX_DPR to taste (2 = the old behaviour).
   Only applies when embedded; the DOM text / form stay perfectly crisp (CSS pixels are not affected). */
(function () {
  var SCENE_MAX_DPR = 1.5;
  try {
    if (window.parent !== window && (window.devicePixelRatio || 1) > SCENE_MAX_DPR) {
      Object.defineProperty(window, 'devicePixelRatio', { configurable: true, get: function () { return SCENE_MAX_DPR; } });
    }
  } catch (e) {}
})();
</script>
<script>
(function () {
  try { console.info('[contact-scene] build v5'); } catch (e) {}
  /* the scene reads its light / dark theme from a cookie (default: light = white). Dark = the original's dark loader. */
  try { if (!/(?:^|; )theme=dark\b/.test(document.cookie)) document.cookie = 'theme=dark; path=/; max-age=31536000; SameSite=Lax'; } catch (e) {}

  /* ?start=lake -> the scene boots on its lake view (the engine's "/" page: night, water, rocks, grass, no purple ring,
     no text) and waits there. The portfolio's scroll-reveal shows it under the Work section, then sends "open-contact"
     to continue to the form. Without it the scene boots straight on the form, exactly as before. */
  var LAKE = /[?&]start=lake(&|$)/.test(location.search);
  /* ?wait=1 (form page opened by the portfolio's Contact button): the scene waits for the page's "enter" message
     instead of opening by itself when it is scrolled into view, so the opening animation is seen on arrival */
  var WAIT = /[?&]wait=1(&|$)/.test(location.search);
  var lake = { on: LAKE, hs: null, paused: false };
  if (LAKE) document.documentElement.classList.add('lake-mode');

  /* the scene's router must see the page it was built as: /contact for the form, "/" for the lake */
  try { history.replaceState(history.state, '', (LAKE ? '/' : '/contact') + location.search); } catch (e) {}

  /* while the page says "pause" (the lake hidden behind Work, or the contact page covered by Work) the scene renders at ~2 fps */
  if (window.parent !== window) {
    var rafReal = window.requestAnimationFrame.bind(window), cafReal = window.cancelAnimationFrame.bind(window);
    var held = {}, heldSeq = 1e9, heldTimer = 0;
    var flushHeld = function () { var q = held; held = {}; Object.keys(q).forEach(function (k) { rafReal(q[k]); }); };
    window.requestAnimationFrame = function (cb) {
      if (!lake.paused) return rafReal(cb);
      var id = ++heldSeq; held[id] = cb;
      if (!heldTimer) heldTimer = setInterval(function () { if (lake.paused) flushHeld(); }, 500);
      return id;
    };
    window.cancelAnimationFrame = function (id) { if (id > 1e9) delete held[id]; else cafReal(id); };
    var setPaused = function (p) {
      if (p === lake.paused) return;
      lake.paused = p;
      if (!p) { clearInterval(heldTimer); heldTimer = 0; flushHeld(); }
    };
  }

  var host = window.parent !== window ? window.parent : null;
  function send(msg) {
    if (!host) return;
    msg.source = 'contact-scene';
    host.postMessage(msg, location.origin);
  }

  /* dark only for the loader and the opening ring; once the ring has opened, the scene goes back to its usual colours */
  var rootEl = document.documentElement;
  function startBack() {
    var go = function () {
      setTimeout(function () {
        rootEl.setAttribute('data-theme', 'light');
        try { document.cookie = 'theme=light; path=/; max-age=31536000; SameSite=Lax'; } catch (e) {}
        /* after the lake -> contact navigation the scene re-applies its own (dark) theme once the route has changed:
           keep the usual colours (this only happens in lake mode; on the form page nothing re-applies it) */
        if (LAKE) {
          new MutationObserver(function () {
            if (rootEl.getAttribute('data-theme') !== 'light') rootEl.setAttribute('data-theme', 'light');
          }).observe(rootEl, { attributes: true, attributeFilter: ['data-theme'] });
        }
      }, 2400);
    };
    if (rootEl.classList.contains('loaded')) { go(); return; }
    var back = new MutationObserver(function () {
      if (!rootEl.classList.contains('loaded')) return;
      back.disconnect();
      go();
    });
    back.observe(rootEl, { attributes: true, attributeFilter: ['class'] });
  }
  /* on the form page this runs at boot, as before. In lake mode it waits until the contact page is opened. */
  if (!LAKE) startBack();

  /* 1. no sound -> the "enter with / without audio" screen is skipped automatically.
        Inside the portfolio the scene WAITS at its loader and opens (loader leaves, camera flies
        in to the tree) only when the visitor scrolls to it, so the opening animation is seen. */
  var allowed = !host || LAKE;              /* opened on its own page: enter at once. The lake opens by itself (it is hidden behind the page). */
  var lakeSetUp = !LAKE;                    /* lake mode waits until its patches are installed */
  var gate = new MutationObserver(tryEnter);
  var formReadySent = false;
  function tryEnter() {
    /* form page opened by the portfolio's Contact button (?wait=1): tell the page the moment the scene is booted and
       waiting, so the page can start the opening ring only when it will play smoothly (never on a half-loaded scene) */
    if (WAIT && !formReadySent && document.querySelector('.loader--ready')) { formReadySent = true; send({ type: 'form-ready' }); }
    if (!allowed || !lakeSetUp || !document.querySelector('.loader--ready')) return;
    var btns = document.querySelectorAll('.loader__actions button');
    for (var i = 0; i < btns.length; i++) {

        btns[i].click();

      }
    }

  gate.observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ['class'] });

      }

      var m = document.createElement('div');

      document.body.appendChild(m);
      seen.observe(m);

  /* ---- lake mode: the engine's own home view minus the purple particle ring and the page text ---- */
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  async function setUpLake() {
    var hs = null, world = null;
    try {
      var mod = await import('/contact-scene/_nuxt/T7ii45zO.js');
      world = mod.b();

        var h = m && m.heroScene;

      }

        var reveal = hs.playPageTextReveal;

        Object.keys(hs.pageTexts).forEach(function (k) {
          var g = hs.pageTexts[k] && hs.pageTexts[k].text && hs.pageTexts[k].text.group;
          if (!g) return;

          Object.defineProperty(g, 'visible', { configurable: true, get: function () { return k === 'contacts' && !lake.on ? gv : false; }, set: function (v) { gv = v; } });
        });

        lake.hs = hs;
      }

    lakeSetUp = true;
    tryEnter();
    if (!world) return;
    for (var k = 0; k < 900 && !world.manager.state.introPlayed; k++) await sleep(200);
    await sleep(400);

    warmUp();
  }
  /* The contact page waits for every font (up to 3 s) before it starts its entrance, and its code is only imported when the
     route changes. Doing both NOW, while the lake sits hidden behind Work, removes that wait from the moment that matters. */
  function warmUp() {
    try { Array.prototype.forEach.call(document.fonts, function (f) { f.load().catch(function () {}); }); } catch (e) {}
    try { import('/contact-scene/_nuxt/DL4QAMwX.js').catch(function () {}); } catch (e) {}   /* mapped to the v5 file by the import map */
  }
  if (LAKE) setUpLake();

  /* leave the lake: show the page UI again and do the engine's own "/" -> "/contact" navigation, so the camera
     flies to the tree and the form appears exactly as on the original site. The usual dark -> light colour
     change then runs 2.4 s later, as it does when the scene opens on the form. */
  function openContact() {
    if (!LAKE || !lake.on) return;
    lake.on = false;
    if (typeof setPaused === 'function') setPaused(false);
    document.documentElement.classList.remove('lake-mode');
    try { lake.hs && lake.hs.setEnergyFiringSuppressed(false); } catch (e) {}
    var a = document.querySelector('a[href="/contact"]');
    window.__allowNav = true;
    try { a ? a.click() : history.pushState(null, '', '/contact'); } finally { window.__allowNav = false; }
    startBack();
  }

  window.addEventListener('message', function (e) {
    if (e.origin !== location.origin || e.source !== host || !e.data) return;
    if (e.data.type === 'enter') { allowed = true; tryEnter(); }
    else if (e.data.type === 'open-contact') openContact();
    else if (e.data.type === 'pause' && typeof setPaused === 'function') setPaused(true);
    else if (e.data.type === 'resume' && typeof setPaused === 'function') setPaused(false);
  });

  /* 2. links: files / external -> new tab, site routes -> scroll the portfolio */
  document.addEventListener('click', function (e) {
    if (window.__allowNav) return; /* the lake -> contact navigation above */
    var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
    if (!a) return;
    var raw = a.getAttribute('href') || '';
    if (raw.charAt(0) !== '/' && !/^https?:/i.test(raw)) return; /* mailto:, tel:, # stay as they are */
    var u = new URL(a.href, location.href);
    if (u.origin === location.origin) {
      e.preventDefault(); e.stopImmediatePropagation();
      if (/\.[a-z0-9]+$/i.test(u.pathname)) { window.open(a.href, '_blank', 'noopener'); return; }

      if (map[u.pathname]) send({ type: 'goto', id: map[u.pathname] });

      e.preventDefault(); e.stopImmediatePropagation();
      window.open(a.href, '_blank', 'noopener');
    }
  }, true);

  /* 3. scroll hand-off: at the top / bottom of the form, the wheel scrolls the portfolio */
  var scroller = null;
  window.addEventListener('wheel', function (e) {
    if (!host || lake.on || e.ctrlKey) return;
    if (e.target && e.target.closest && e.target.closest('[data-lenis-prevent]')) return;
    if (!scroller || !scroller.isConnected) scroller = document.querySelector('.smooth-scroll');
    if (!scroller) return;
    var dy = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaMode === 2 ? e.deltaY * innerHeight : e.deltaY;
    var atTop = scroller.scrollTop <= 1;
    var atEnd = scroller.scrollTop >= scroller.scrollHeight - scroller.clientHeight - 1;

      e.preventDefault(); e.stopImmediatePropagation();
      send({ type: 'wheel', dy: dy });
    }
